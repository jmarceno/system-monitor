[project]
name = "system-monitor"
version = "0.2.0"
description = "Floating Wayland system monitor with honest zram vs disk-swap attribution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
system-monitor = "sysmon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sysmon"]
