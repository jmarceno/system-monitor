# system-monitor is a normal desktop window.
# Do not float, pin, or remove its border — that was the old Quickshell widget.
# If a previous copy of this file is sourced from hyprland.conf, delete these
# lines from the live config so the compositor frame comes back:
#   windowrulev2 = float, class:^(system-monitor)$
#   windowrulev2 = pin, class:^(system-monitor)$
#   windowrulev2 = nofocus, class:^(system-monitor)$
#   windowrulev2 = noborder, class:^(system-monitor)$
#   windowrulev2 = noshadow, class:^(system-monitor)$
